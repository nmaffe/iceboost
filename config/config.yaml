#                     'smb', 't2m', 'dist_from_ocean', 'Cluster_area', 'elevation_0_1', 'elevation_from_zmin', 'elevation_0_1' ]
featuresBase: &base ['elevation', 'dist_from_border_km_geom',
                   'slope50', 'slope75', 'slope100', 'slope125', 'slope150', 'slope300', 'slope450', 'slopegfa',
                 'curv_50',  'curv_100', 'curv_150', 'curv_300', 'curv_450', 'curv_gfa',
                     'smb', 't2m', 'dist_from_ocean']
featuresVel: &vel ['v50', 'v100', 'v150', 'v300', 'v450', 'vgfa']
featuresBase_with_size:
    - *base
    - ['lmax']
features:
    - *base
    - *vel

resolutionXY: 100
ice_velocity_threshold: 5.0 # m/yr
area_deploy_threshold: 10 # km2

# configs for feature fetching
graph_max_layer_depth: 3 # maximum depth consider in the graph used to calculate the glacier cluster
deploy_mode: 'auto'               # Options: 'auto' for cluster, 'single' for single glacier

# n_jobs: 1 for single processing, 2+ for multiprocessing
# -----------
# rgi      | n_jobs
# 1,2,13,14,15,16,17 | 20
# 3,4,7,8,10,11,12,18 | 8
# 5       | 12
# 6,9,19  | 4
n_jobs: 20

